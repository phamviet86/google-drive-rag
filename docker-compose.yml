services:
  gdrive-rag:
    build: .
    image: google-drive-rag:local
    restart: unless-stopped
    init: true  # reaps LibreOffice child processes and forwards stop signals
    # Memory ceiling: an unusually large file can then only restart this service, not exhaust the
    # host. Change it with GDRAG_MEMORY_LIMIT in .env (for example 4g).
    mem_limit: ${GDRAG_MEMORY_LIMIT:-8g}
    memswap_limit: ${GDRAG_MEMORY_LIMIT:-8g}
    env_file:
      - path: .env
        required: false
    ports:
      # Only reachable from the VPS itself (Claude Code runs there). Never expose publicly.
      - "127.0.0.1:8765:8765"
    volumes:
      - gdrive-rag-data:/data
      # Put the Google JSON file here (owned by uid 10001, mode 600); mounted read-only.
      - ./secrets:/secrets:ro
      # Local folder sources: this host folder is seen as /local inside the container
      # (read-only; files must be readable by uid 10001, e.g. mode 644 / folders 755).
      # Change the host folder with GDRAG_LOCAL_HOST_DIR in .env.
      - ${GDRAG_LOCAL_HOST_DIR:-./local}:/local:ro

volumes:
  gdrive-rag-data:
