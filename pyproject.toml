[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "google-drive-rag"
version = "0.1.0"
description = "Search Google Drive documents from Claude Code over MCP (Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "mcp==2.3.0",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "python-calamine>=0.3,<1",
  "pdf-inspector==1.25.2",
  "pillow>=10,<14",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "google-api-python-client==2.198.0",
  "google-auth-oauthlib==1.4.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20,<2",
  "pytest>=8,<10",
  "ruff>=0.5",
  "reportlab>=4,<5",
]

[project.scripts]
gdrive-rag = "gdrive_rag.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdrive_rag = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["gdrive_rag"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
