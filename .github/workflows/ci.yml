name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Tesseract with Vietnamese and English data (for the real-OCR test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-vie tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest -q -rs
      - name: The real-OCR test must have run, not been skipped
        shell: bash  # -eo pipefail, so a failing pytest is not hidden by tee
        run: pytest -q -rs -k real_tesseract | tee ocr.log && ! grep -q SKIPPED ocr.log
      - run: python -m compileall -q src tests

  docker:
    # Builds the image on x86_64. The build runs a real Tesseract pass on Vietnamese text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t google-drive-rag:ci .
      - name: Start the container and check it answers
        run: |
          docker run -d --name gdrag -p 127.0.0.1:8765:8765 google-drive-rag:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 2
          done
          docker logs gdrag
          exit 1
